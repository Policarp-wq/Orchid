name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Build
        run: dotnet build Orchid.slnx --configuration Release

      - name: Test
        run: dotnet test --solution Orchid.slnx --no-build --configuration Release
