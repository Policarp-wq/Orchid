name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK dependencies
        run: dotnet build src/Orchid.Presentation.Android/Orchid.Presentation.Android.csproj -t:InstallAndroidDependencies -p:AcceptAndroidSDKLicenses=True

      - name: Restore
        run: dotnet restore Orchid.slnx

      - name: Build
        run: dotnet build Orchid.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Orchid.slnx --no-build --no-restore --configuration Release
