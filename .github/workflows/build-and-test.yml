name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        if: ${{ hashFiles('Orchid.slnx') != '' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: ${{ hashFiles('Orchid.slnx') != '' }}
        run: dotnet restore Orchid.slnx

      - name: Build
        if: ${{ hashFiles('Orchid.slnx') != '' }}
        run: dotnet build Orchid.slnx --no-restore --configuration Release

      - name: Test
        if: ${{ hashFiles('Orchid.slnx') != '' }}
        run: dotnet test Orchid.slnx --no-build --no-restore --configuration Release

      - name: Report documentation-only repository
        if: ${{ hashFiles('Orchid.slnx') == '' }}
        shell: bash
        run: echo "No solution is present; build and tests do not apply." >> "$GITHUB_STEP_SUMMARY"
